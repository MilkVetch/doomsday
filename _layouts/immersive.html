<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>{% if page.title %}{{ page.title }} · {% endif %}末世劫 · 机密档案</title>
	<link rel="stylesheet" href="{{site.baseurl}}/css/common.css?v=20261014h">
</head>
<body class="immersive {{ page.body_class }}">
<div id="progress"></div>

<div class="float-ui">
	{% include lang-toggle.html %}
	{% if page.dna_overlay %}
	<button class="dna-toggle" id="dnaToggle" aria-label="章节目录 / Contents" title="章节目录 / Contents">
		<span></span><span></span><span></span>
	</button>
	{% endif %}
</div>

<button class="music-btn" data-music-btn aria-label="背景音乐开关 / Toggle background music" title="背景音乐 / Music">
	<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
	<span class="music-bars"><i></i><i></i><i></i></span>
</button>

{% if page.dna_overlay %}
<div class="dna-overlay" id="dnaOverlay" hidden>
	{% include dna-stage.html %}
	<a class="dna-home" href="{{site.baseurl}}/"><span class="t-zh">返回首页</span><span class="t-en">Home</span></a>
</div>
{% endif %}

{{content}}

<script>window.DOOMSDAY_BASEURL="{{site.baseurl}}";</script>
<script src="{{site.baseurl}}/js/i18n.js?v=20261013e"></script>
<script src="{{site.baseurl}}/js/main.js?v=20261013e"></script>
<script src="{{site.baseurl}}/js/dna.js?v=20261014f"></script>
<script src="{{site.baseurl}}/js/reader.js?v=20261014d"></script>
<script src="{{site.baseurl}}/js/loader.js?v=20261014c"></script>
<script src="{{site.baseurl}}/js/musicbtn.js?v=20261014a"></script>
</body>
</html>

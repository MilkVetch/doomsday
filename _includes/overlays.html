<div class="reader" id="reader" hidden>
	<div class="reader-top">
		<button class="dna-toggle" id="readerMenu" aria-label="返回目录 / Back to contents" title="返回目录 / Back to contents">
			<span></span><span></span><span></span>
		</button>
	</div>
	<div class="reader-scroll" id="readerScroll">
		<div class="reader-inner">
			<div class="reader-head">
				<div class="reader-kicker"><span class="t-zh" id="readerKickerZh"></span><span class="t-en" id="readerKickerEn"></span></div>
				<h2 class="reader-title"><span class="t-zh" id="readerTitleZh"></span><span class="t-en" id="readerTitleEn"></span></h2>
			</div>
			<div class="reader-body story-body" id="readerBody"></div>
			<div class="reader-foot">
				<button class="reader-prev" id="readerPrev">
					<span class="dir"><span class="t-zh">← 上一章</span><span class="t-en">← Prev chapter</span></span>
					<span class="t"><span class="t-zh" id="readerPrevZh"></span><span class="t-en" id="readerPrevEn"></span></span>
				</button>
				<button class="reader-next" id="readerNext">
					<span class="dir"><span class="t-zh">下一章 →</span><span class="t-en">Next chapter →</span></span>
					<span class="t"><span class="t-zh" id="readerNextZh"></span><span class="t-en" id="readerNextEn"></span></span>
				</button>
			</div>
		</div>
	</div>
</div>
